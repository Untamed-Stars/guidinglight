<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Guiding Light</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            background: #07111f;
        }

        canvas {
            display: block;
        }

        #crosshair {
            position: fixed;
            left: 50%;
            top: 50%;
            width: 6px;
            height: 6px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: white;
            pointer-events: none;
        }

        #controls {
            position: fixed;
            left: 20px;
            bottom: 20px;
            color: white;
            font-family: sans-serif;
            font-size: 14px;
            pointer-events: none;
            opacity: 0.7;
        }
    </style>
</head>

<body>

    <div id="crosshair"></div>

    <div id="controls">
        WASD to move · Mouse to look · Space to jump
    </div>

    <script type="module" src="game.js"></script>

</body>
</html>
